@if (failed()) {
  <div class="player">
    <div class="player-column failed">
      <p>這一輪無法開始</p>
      <button type="button" class="text-action" (click)="exit()">回到首頁</button>
    </div>
  </div>
} @else {
  <div class="player">
    <div class="player-column">
      <header class="player-bar">
        <button type="button" class="text-action" (click)="exit()">離開</button>
        <p>{{ title() }}</p>
      </header>
      <div class="player-switches">
        <button
          type="button"
          class="text-action"
          [attr.aria-pressed]="musicOn()"
          (click)="toggleMusic()"
        >
          {{ musicOn() ? '關閉音樂' : '開啟音樂' }}
        </button>
        <button
          type="button"
          class="text-action"
          [attr.aria-pressed]="voiceOn()"
          (click)="toggleVoice()"
        >
          {{ voiceOn() ? '關閉人聲' : '開啟人聲' }}
        </button>
      </div>
      @if (musicHint()) {
        <p class="music-hint">{{ musicHint() }}</p>
      }
      <div class="visual" #visualHost></div>
      <p class="phase">{{ phaseLabel() }}</p>
      <p class="count">{{ countText() }}</p>
      <p class="line" [style.opacity]="opacity()">{{ line() }}</p>
      <div class="timeline">
        <div
          class="track"
          role="slider"
          tabindex="0"
          aria-label="播放時間"
          [attr.aria-valuemin]="0"
          [attr.aria-valuemax]="durationMs"
          [attr.aria-valuenow]="elapsedMs()"
          (pointerdown)="scrubStart($event)"
          (pointermove)="scrubMove($event)"
          (pointerup)="scrubEnd($event)"
          (pointercancel)="scrubEnd($event)"
          (keydown)="scrubKey($event)"
        >
          <i></i>
          <span class="dot" [style.left.%]="progress()"></span>
        </div>
        <div class="times">
          <span>{{ elapsedLabel() }}</span>
          <span>{{ totalLabel() }}</span>
        </div>
      </div>
      <button
        type="button"
        class="text-action pause"
        [attr.aria-label]="paused() ? '繼續' : '暫停'"
        (click)="toggle()"
      >
        @if (paused()) {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5z" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z" />
          </svg>
        }
      </button>
    </div>
  </div>
}
